name: Daily Update

on:
  schedule:
    # Run at 08:23 Beijing time. Avoid exact-hour cron slots because GitHub
    # scheduled workflows can be delayed heavily around the top of the hour.
    - cron: '23 0 * * *'
  workflow_dispatch:

concurrency:
  group: daily-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv sync

      - name: Run workflow
        env:
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          MOONSHOT_BASE_URL: ${{ secrets.MOONSHOT_BASE_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          export PYTHONPATH="${GITHUB_WORKSPACE}/src"
          uv run python src/run_github.py

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "auto: 每日数据更新"
          git pull --rebase origin main
          git push origin HEAD:main
