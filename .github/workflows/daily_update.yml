name: Daily Update

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

concurrency:
  group: daily-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv sync

      - name: Run workflow
        id: run_workflow
        env:
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          MOONSHOT_BASE_URL: ${{ secrets.MOONSHOT_BASE_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          COZE_WORKSPACE_PATH: ${{ github.workspace }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          export PYTHONPATH="${GITHUB_WORKSPACE}/src"
          uv run python src/run_github.py

      - name: Upload quality gate diagnostic on failure
        if: failure() && steps.run_workflow.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-diagnostic
          path: assets/data/quality_gate_last_run.json
          if-no-files-found: ignore

      - name: Generate hot content (weekly, Monday UTC)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          COZE_WORKSPACE_PATH: ${{ github.workspace }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          export PYTHONPATH="${GITHUB_WORKSPACE}/src"
          DOW=$(date -u +%u)
          if [ "$DOW" = "1" ]; then
            echo "Monday UTC: generating hot content channel data..."
            uv run python scripts/generate_hot_content.py
          else
            echo "Skip hot content generation (UTC weekday=$DOW, only runs on Monday)"
          fi

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "auto: 每日数据更新"
          git pull --rebase origin main
          git push origin HEAD:main
