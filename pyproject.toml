[project]
name = "shortvideo-news"
version = "0.1.0"
description = "短剧看板自动化采集系统"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "Jinja2>=3.1.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "cozeloop>=0.1.28",
    "uvicorn>=0.30.0",
    "fastapi>=0.115.0",
    "requests>=2.31.0",
    "duckduckgo-search>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = []
[tool.uv]
[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
