name: 🚀 Daily Short-Drama Dashboard Update

# 触发条件
on:
  schedule:
    # 每天北京时间早上 8:00 执行 (UTC 时间 0:00)
    - cron: '0 0 * * *'
  workflow_dispatch:
    # 允许你在 GitHub 网页上手动点击按钮触发运行，方便测试

# 任务流程
jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 拉取代码库 (Checkout repository)
        uses: actions/checkout@v4

      - name: 🐍 设置 Python 环境 (Set up Python)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 安装 uv 和依赖包 (Install uv & dependencies)
        run: |
          # 安装 uv 包管理器 (比 pip 快 10 倍以上)
          curl -LsSf https://astral.sh/uv/install.sh | sh
          
          # 使用 uv 安装 pyproject.toml 里的所有依赖
          uv pip install --system -r pyproject.toml

      - name: ⚙️ 运行数据引擎 (Run data workflow)
        env:
          # 在这里配置你的 API 密钥，需提前在 GitHub Secrets 中添加
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          COZE_API_KEY: ${{ secrets.COZEK_API_KEY }}
          # 设定工作目录为当前目录
          COZE_WORKSPACE_PATH: "."
        run: |
          # 运行主流程脚本
          python src/main.py

      - name: 🚀 提交并推送最新数据 (Commit and push changes)
        run: |
          # 配置 Git 机器人信息
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 只将 assets/data/ 目录下的更新添加到暂存区
          git add assets/data/latest.json assets/data/history/*.json assets/data/all_history.json
          
          # 检查是否有数据更新，如果有则 commit 并 push
          if git diff --staged --quiet; then
            echo "今日数据无变化，跳过推送。"
          else
            git commit -m "📊 Auto-update: 短剧大盘数据 [$(date +'%Y-%m-%d')]"
            git push
          fi